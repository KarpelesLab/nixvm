name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      # `--all-features` is intentionally NOT used: `wasm` pulls in wasm-bindgen
      # (only builds for wasm32) and `hvf`/`kvm` are target-gated backends. The
      # feature sets below are the ones that build on a normal host.
      - name: Clippy (default features, warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (fstool, warnings denied)
        run: cargo clippy --all-targets --features fstool -- -D warnings


      - name: Test (default features)
        run: cargo test

      - name: Test (fstool)
        run: cargo test --features fstool

      - name: Clippy (Docker/OCI images, warnings denied)
        run: cargo clippy --all-targets --features oci,fetch,oci-net -- -D warnings

      - name: Test (Docker/OCI images, offline parts)
        run: cargo test --features oci,oci-net --lib oci

      - name: Clippy (tunnel networking, warnings denied)
        run: cargo clippy --all-targets --features tunnel -- -D warnings

      - name: Test (tunnel networking)
        run: cargo test --features tunnel --lib tunnel

  # Boots a real Alpine root image on each execution path. tests/alpine_boot.rs
  # skips itself without an image, so nothing else in CI runs these tests. KVM
  # and the interpreter behave differently enough to need separate runs: guests
  # run orders of magnitude faster on KVM, which has already hidden a test bug.
  alpine:
    name: Alpine boot (${{ matrix.guest }} guest, ${{ matrix.backend }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, guest: x86_64, backend: kvm }
          - { os: ubuntu-latest, guest: x86_64, backend: interp }
          - { os: ubuntu-latest, guest: aarch64, backend: interp }
          - { os: macos-latest, guest: aarch64, backend: interp }
    env:
      # Pinned to the branch the browser demo ships (see pages.yml), and verified
      # by digest, so a new Alpine release can't change what these tests run on.
      ALPINE_VERSION: 3.20.10
      SHA256_x86_64: 0d44a414245f043ae56872a23762e6c9bee585da2cbe4aa81cbd0331eaf53223
      SHA256_aarch64: 61ac877fdbcee6914731bc22a4ed5668ea3470f201f97a7078931c48b71bbeec
      NIXVM_INTERP: ${{ matrix.backend == 'interp' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: alpine-${{ matrix.os }}

      - name: Locate the Alpine image
        run: |
          echo "NIXVM_ALPINE_TAR=$RUNNER_TEMP/alpine/alpine.tar" >> "$GITHUB_ENV"
          echo "NIXVM_ALPINE_TARGZ=$RUNNER_TEMP/alpine/alpine.tar.gz" >> "$GITHUB_ENV"

      - name: Cache the Alpine image
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/alpine/alpine.tar.gz
          key: alpine-minirootfs-${{ env.ALPINE_VERSION }}-${{ matrix.guest }}

      - name: Fetch and verify the Alpine image
        env:
          SHA256: ${{ matrix.guest == 'x86_64' && env.SHA256_x86_64 || env.SHA256_aarch64 }}
        run: |
          mkdir -p "$(dirname "$NIXVM_ALPINE_TARGZ")"
          if [ ! -f "$NIXVM_ALPINE_TARGZ" ]; then
            branch="v${ALPINE_VERSION%.*}"
            file="alpine-minirootfs-$ALPINE_VERSION-${{ matrix.guest }}.tar.gz"
            curl -fsSL --retry 5 -o "$NIXVM_ALPINE_TARGZ" \
              "https://dl-cdn.alpinelinux.org/alpine/$branch/releases/${{ matrix.guest }}/$file"
          fi
          echo "$SHA256  $NIXVM_ALPINE_TARGZ" | shasum -a 256 -c -
          gzip -dc "$NIXVM_ALPINE_TARGZ" > "$NIXVM_ALPINE_TAR"

      - name: Give the runner access to /dev/kvm
        if: matrix.backend == 'kvm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The backend probe falls back to the interpreter when KVM is unusable, so
      # without this check the job would pass without ever running on KVM.
      - name: Require a working KVM
        if: matrix.backend == 'kvm'
        run: |
          set -o pipefail
          cargo test --lib vcpu::kvm -- --nocapture 2>&1 | tee kvm.log
          if grep -q 'skipping KVM test' kvm.log; then
            echo '::error::KVM is not usable on this runner'
            exit 1
          fi

      # On KVM here, unlike the `test` job, whose runner has no access to /dev/kvm,
      # and on an aarch64 guest (the interpreter), built with a cross compiler.
      - name: Install an aarch64 cross compiler
        if: matrix.backend == 'kvm'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Run the guest conformance programs on KVM and on aarch64
        if: matrix.backend == 'kvm'
        run: |
          set -o pipefail
          cargo test --test guest_conformance -- --nocapture 2>&1 | tee conformance.log
          if grep -q 'skipping' conformance.log; then
            echo '::error::the conformance programs skipped themselves'
            exit 1
          fi

      # The cgroups, rlimits and sched programs need root (and cgroups a real cgroup v2
      # tree), which this runner has: run them on the host too, so their
      # expectations are Linux's. exec doesn't, but its ELF images are ours.
      - name: Check the root-only programs against Linux
        if: matrix.backend == 'kvm'
        run: |
          for p in cgroups rlimits sched exec fifo devfd; do
            gcc -static -O2 -pthread -o "$RUNNER_TEMP/$p" "tests/guest/$p.c"
            echo "== $p"
            sudo "$RUNNER_TEMP/$p"
          done

      # Pull real images from Docker Hub and run them as `docker run` would.
      - name: Pull and run Docker images
        if: matrix.backend == 'kvm'
        run: |
          set -o pipefail
          NIXVM_OCI_TESTS=1 cargo test --features oci,fetch,oci-net --test oci_images -- --nocapture 2>&1 | tee oci.log
          if grep -q 'skipping' oci.log; then
            echo '::error::the image pull tests skipped themselves'
            exit 1
          fi

      # Real tools using every namespace at once find what targeted tests don't.
      - name: Run bubblewrap and util-linux in the VM
        if: matrix.backend == 'kvm'
        run: |
          set -o pipefail
          export NIXVM_BWRAP_TAR="$RUNNER_TEMP/bwrap.tar"
          scripts/alpine-with-bwrap.sh "$NIXVM_ALPINE_TAR" "$NIXVM_BWRAP_TAR"
          cargo test --features fstool --test namespace_tools -- --nocapture 2>&1 | tee tools.log
          if grep -q 'NIXVM_BWRAP_TAR not set' tools.log; then
            echo '::error::the namespace tools test skipped itself'
            exit 1
          fi

      - name: Run the live boot tests
        run: |
          set -o pipefail
          cargo test --features fstool,targz,tunnel --test alpine_boot -- --nocapture 2>&1 | tee boot.log
          # Not the tunnel test's "NIXVM_TUNNEL_BRIDGE/NIXVM_ALPINE_TAR not set":
          # that one needs a live bridge, so it is expected to skip here.
          if grep -Eq '(^|[^/])NIXVM_ALPINE_TAR(GZ)? not set' boot.log; then
            echo '::error::a test skipped itself for lack of an Alpine image'
            exit 1
          fi

  wasm:
    name: wasm build guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # Guards the browser demo build (src/wasm.rs). `--lib` skips the cfg(unix)
      # bins, matching how pages.yml builds the deployable artifact.
      - name: Build wasm demo library
        run: cargo build --lib --target wasm32-unknown-unknown --features wasm --no-default-features

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # `--all-features` is avoided (wasm/hvf/kvm don't build on a host doc run);
      # `fstool` and `oci,fetch` cover the optional modules with public docs.
      - name: cargo doc --no-deps --features fstool,oci,fetch,oci-net
        run: cargo doc --no-deps --features fstool,oci,fetch,oci-net
